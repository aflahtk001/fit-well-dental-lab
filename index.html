<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fit Well Dental Lab - Desktop Billing Software</title>
    <script>
      window.addEventListener('error', function(e) {
        console.error('[UNCAUGHT ERROR]:', e.message, e.filename, e.lineno, e.colno, e.error ? e.error.stack : 'no stack');
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[UNHANDLED REJECTION]:', e.reason ? (e.reason.stack || e.reason) : e);
      });
    </script>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
